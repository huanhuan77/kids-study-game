<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📚 闯关复习大作战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, #B8E986 0%, #D4F5A0 50%, #C9F088 100%);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
    color: #333;
  }

  /* App Container */
  .app { position: relative; z-index: 1; width: 100%; max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

  /* Screen Base */
  .screen {
    display: none;
    flex-direction: column;
    height: 100%;
    padding: 20px 18px 20px;
    animation: fadeIn .35s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  /* Common */
  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #555; transition: .2s;
  }
  .icon-btn:active { transform: scale(.9); background: rgba(0,0,0,.05); }

  /* ============ Screen: Grade Select ============ */
  .screen-grade { justify-content: space-between; padding-top: 60px; padding-bottom: 40px; }
  .grade-title {
    text-align: center; color: #fff; padding: 12px 0 30px;
    text-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  .grade-title h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
  .grade-title p { font-size: 14px; opacity: .9; }

  .grade-grid { display: flex; flex-direction: column; gap: 18px; padding: 10px 0; }
  .grade-card {
    background: rgba(255,255,255,.85);
    border-radius: 22px;
    padding: 28px 24px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer;
    transition: transform .2s;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.6);
  }
  .grade-card:active { transform: scale(.97); }
  .grade-card .gicon { font-size: 48px; }
  .grade-card .ginfo h2 { font-size: 22px; font-weight: 800; color: #4A3520; }
  .grade-card .ginfo p { font-size: 13px; color: #8A6B50; margin-top: 4px; }
  .grade-card .arrow { margin-left: auto; color: #B89578; font-size: 20px; }

  .grade-bottom { text-align: center; color: rgba(255,255,255,.95); font-size: 13px; padding-top: 16px; text-shadow: 0 1px 4px rgba(0,0,0,.1); }

  /* ============ Screen: Subject Select ============ */
  .screen-subject { padding-top: 18px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px 16px;
  }
  .topbar h1 { font-size: 20px; font-weight: 800; color: #4A3520; }

  .subj-grid { flex: 1; display: grid; gap: 14px; align-content: center; padding: 10px 0; }
  .subj-card {
    background: rgba(255,255,255,.9);
    border-radius: 20px;
    padding: 22px 18px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    transition: transform .2s;
    border: 1px solid rgba(255,255,255,.6);
    backdrop-filter: blur(6px);
  }
  .subj-card:active { transform: scale(.97); }
  .subj-card .sicon { font-size: 38px; }
  .subj-card .sinfo { flex: 1; }
  .subj-card .sinfo h2 { font-size: 18px; font-weight: 800; color: #4A3520; }
  .subj-card .sinfo p { font-size: 12px; color: #8A6B50; margin-top: 2px; }
  .subj-card .sarrow { color: #B89578; font-size: 20px; }
  .subj-card .sstars { color: #FFB627; font-size: 13px; margin-top: 4px; }

  /* ============ Screen: Level Select ============ */
  .screen-levels { padding-top: 18px; }
  .level-info { color: #8A6B50; font-size: 13px; padding: 8px 4px 14px; text-align: center; }
  .level-scroll { flex: 1; overflow-y: auto; padding: 0 0 10px; -webkit-overflow-scrolling: touch; }
  .level-scroll::-webkit-scrollbar { width: 4px; }
  .level-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.1); border-radius: 2px; }
  .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 4px 0; }
  .level-btn {
    aspect-ratio: 1;
    background: rgba(255,255,255,.85);
    border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: .2s;
    border: 1px solid rgba(255,255,255,.7);
    backdrop-filter: blur(4px);
    position: relative;
    gap: 4px;
  }
  .level-btn:active:not(.locked) { transform: scale(.93); }
  .level-btn.locked { opacity: .55; cursor: not-allowed; }
  .level-btn .lvl-num { font-size: 22px; font-weight: 800; color: #4A3520; }
  .level-btn .stars { font-size: 11px; letter-spacing: 1px; color: #FFB627; }
  .level-btn .lock-icon { font-size: 16px; opacity: .6; }
  .level-btn.current {
    background: linear-gradient(135deg, #FF8C42, #FF6347);
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(255,140,66,.4);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .level-btn.current .lvl-num, .level-btn.current .stars { color: #fff; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  /* ============ Screen: Game ============ */
  .screen-game {
    padding: 14px 14px 16px;
    background: transparent;
  }
  .game-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 4px 10px;
  }
  .game-progress-top {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,.55);
    border-radius: 3px;
    margin: 0 12px;
    overflow: hidden;
  }
  .game-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #FFD93D, #FF8C42, #FF6347);
    border-radius: 3px;
    transition: width .4s ease;
  }

  .game-meta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px 12px;
    color: #4A3520;
    font-size: 14px;
    font-weight: 700;
  }
  .game-meta .q-progress { color: #6B5B45; }
  .game-meta .combo { color: #FF6347; }
  .game-meta .combo.zero { color: #B89578; }

  .game-card {
    background: #FFFFFF;
    border-radius: 28px;
    padding: 28px 22px 22px;
    flex: 1;
    overflow-y: auto;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    border: 3px solid #FFFFFF;
    animation: bounceIn .35s ease;
  }
  @keyframes bounceIn { from { opacity: 0; transform: scale(.95) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .game-card::-webkit-scrollbar { width: 4px; }
  .game-card::-webkit-scrollbar-thumb { background: rgba(0,0,0,.1); border-radius: 2px; }

  .subject-icon-big {
    font-size: 64px;
    text-align: center;
    margin-bottom: 14px;
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.1));
  }
  .q-text-big {
    font-size: 18px;
    font-weight: 700;
    color: #333333;
    line-height: 1.6;
    text-align: center;
    margin-bottom: 22px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  .option-btn {
    background: #FFFFFF;
    border: 2px solid #ECECEC;
    border-radius: 14px;
    padding: 18px 12px;
    font-size: 17px;
    font-weight: 700;
    color: #333333;
    cursor: pointer;
    transition: .2s;
    text-align: center;
    line-height: 1.4;
    position: relative;
  }
  .option-btn:active:not(.disabled) { transform: scale(.96); }
  .option-btn.selected {
    border-color: #FF8C42;
    background: #FFF7F0;
  }
  .option-btn.correct {
    border-color: #6BCB77;
    background: #E8F8EA;
    color: #2E8B3E;
  }
  .option-btn.correct .star-badge {
    display: block;
    position: absolute;
    top: -10px; left: -8px;
    font-size: 24px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.2));
    animation: starPop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes starPop { from { transform: scale(0); } to { transform: scale(1); } }
  .star-badge { display: none; }
  .option-btn.wrong {
    border-color: #FF8C9E;
    background: #FFE8EC;
    color: #E74C3C;
  }
  .option-btn.disabled { pointer-events: none; }

  /* Inline answer reveal */
  /* Inline answer feedback (simple text below options) */
  .inline-reveal {
    margin-top: 8px;
    text-align: center;
    animation: fadeIn .35s ease;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
  }
  .inline-reveal.wrong {
    color: #FF6B6B;
  }
  .inline-reveal.correct {
    color: #2E8B3E;
  }
  .inline-reveal .reveal-text .correct-ans {
    font-weight: 800;
  }
  .inline-reveal .reveal-explanation {
    margin-top: 6px;
    font-size: 13px;
    color: #8A6B50;
    font-weight: 500;
    line-height: 1.6;
  }
  .inline-reveal .reveal-explanation .exp-tag {
    display: inline-block;
    background: #FFE8D6;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    color: #FF8C42;
    margin-right: 4px;
  }

  /* Game bottom bar */
  .game-bottombar {
    display: flex; gap: 10px; margin-top: 12px;
    flex-shrink: 0;
  }
  .btn-confirm {
    flex: 1;
    background: linear-gradient(135deg, #FF8C42, #FF6347);
    border: none; border-radius: 16px;
    padding: 14px; font-size: 16px; font-weight: 700; color: #fff;
    cursor: pointer; transition: .2s;
    box-shadow: 0 4px 12px rgba(255,140,66,.3);
  }
  .btn-confirm:active:not(:disabled) { transform: scale(.97); }
  .btn-confirm:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn-secondary {
    background: rgba(255,255,255,.85);
    border: none; border-radius: 16px;
    padding: 14px 16px; font-size: 14px; font-weight: 600; color: #4A3520;
    cursor: pointer; transition: .2s;
    border: 1px solid rgba(0,0,0,.05);
  }
  .btn-secondary:active { transform: scale(.97); }

  /* ============ Modal: Result ============ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(74,53,32,.4);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .confirm-box { max-width: 340px; padding: 32px 24px 22px; }
  .confirm-box .confirm-msg {
    color: #8A6B50; font-size: 14px; margin: 4px 0 20px; line-height: 1.5;
  }
  .modal-box {
    background: linear-gradient(180deg, #FFCBA4 0%, #FFE8D6 100%);
    border-radius: 28px;
    padding: 36px 28px 28px; max-width: 380px; width: 100%;
    text-align: center; animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 12px 40px rgba(0,0,0,.15);
  }
  @keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-box .big-emoji { font-size: 80px; margin-bottom: 8px; line-height: 1; }
  .modal-box h2 {
    font-size: 22px;
    color: #FF6B6B;
    font-weight: 800;
    margin-bottom: 12px;
  }
  .modal-box .stars-big { font-size: 36px; letter-spacing: 4px; margin-bottom: 16px; color: #fff; -webkit-text-stroke: 1px #B89578; }
  .modal-box .stars-big .filled { color: #FFB627; -webkit-text-stroke: 1px #E69500; }
  .modal-box .score-label {
    color: #FFB627; font-size: 18px; font-weight: 700; margin-bottom: 4px;
  }
  .modal-box .score-label .num { font-size: 22px; }
  .modal-box .stat-line {
    color: #8A6B50; font-size: 14px; margin-bottom: 24px;
  }

  .modal-buttons { display: flex; gap: 10px; }
  .modal-buttons button {
    flex: 1;
    padding: 12px 8px;
    border-radius: 18px;
    font-size: 14px; font-weight: 700; color: #fff;
    cursor: pointer; transition: .2s;
    border: none;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .modal-buttons button:active { transform: scale(.95); }
  .modal-buttons .btn-retry { background: linear-gradient(135deg, #FF8C42, #FF6347); }
  .modal-buttons .btn-pick { background: linear-gradient(135deg, #4A90E2, #357ABD); }
  .modal-buttons .btn-next { background: linear-gradient(135deg, #6BCB77, #4DAB59); }
  .modal-buttons .btn-pick-icon { font-size: 12px; }

  /* Confetti */
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
  .confetti {
    position: absolute; width: 10px; height: 10px; opacity: .9;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg) scale(.5); opacity: 0; }
  }

  /* Shake */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .shake { animation: shake .4s ease; }

  /* Responsive */
  @media (max-width: 380px) {
    .screen { padding: 14px 14px 18px; }
    .grade-card { padding: 22px 18px; }
    .grade-card .gicon { font-size: 40px; }
    .grade-card .ginfo h2 { font-size: 19px; }
    .q-text-big { font-size: 17px; }
    .options-grid { gap: 10px; }
    .option-btn { padding: 12px 8px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ====== Screen: Grade Select ====== -->
  <div class="screen screen-grade active" id="screenGrade">
    <div class="grade-title">
      <h1>📚 闯关复习大作战</h1>
      <p>选择你的年级，开始挑战吧！</p>
    </div>
    <div class="grade-grid">
      <div class="grade-card" onclick="selectGrade(2)">
        <span class="gicon">🐣</span>
        <div class="ginfo">
          <h2>二年级</h2>
          <p>语文 · 数学 共 40 关</p>
        </div>
        <span class="arrow">›</span>
      </div>
      <div class="grade-card" onclick="selectGrade(5)">
        <span class="gicon">🦊</span>
        <div class="ginfo">
          <h2>五年级</h2>
          <p>语文 · 数学 · 英语 共 60 关</p>
        </div>
        <span class="arrow">›</span>
      </div>
    </div>
    <div class="grade-bottom" id="totalProgressDisplay">🎮 点击上方年级开始</div>
  </div>

  <!-- ====== Screen: Subject Select ====== -->
  <div class="screen screen-subject" id="screenSubject">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('screenGrade')">←</button>
      <h1 id="subjHeader">二年级</h1>
      <div style="width:40px"></div>
    </div>
    <div class="subj-grid" id="subjectGrid">
      <!-- 动态渲染 -->
    </div>
  </div>

  <!-- ====== Screen: Level Select ====== -->
  <div class="screen screen-levels" id="screenLevels">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('screenSubject')">←</button>
      <h1 id="levelHeader">语文 · 二年级</h1>
      <div style="width:40px"></div>
    </div>
    <div class="level-info" id="levelInfo">第 1 关最简单，越往后越有挑战 💪</div>
    <div class="level-scroll">
      <div class="level-grid" id="levelGrid"></div>
    </div>
  </div>

  <!-- ====== Screen: Game ====== -->
  <div class="screen screen-game" id="screenGame">
    <div class="game-topbar">
      <button class="icon-btn" onclick="confirmQuit()">←</button>
      <div class="game-progress-top">
        <div class="game-progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div style="width:40px"></div>
    </div>
    <div class="game-meta">
      <span class="q-progress" id="qProgress">1 / 8</span>
      <span class="combo zero" id="comboDisplay">🔥 连击 0</span>
    </div>
    <div class="game-card" id="questionCard">
      <div class="subject-icon-big" id="subjectIcon">❓</div>
      <div class="q-text-big" id="qText">题目加载中...</div>
      <div class="options-grid" id="optionsContainer"></div>
      <div class="inline-reveal" id="revealBox" style="display:none">
        <div class="reveal-text" id="revealText"></div>
        <div class="reveal-explanation" id="revealExplanation"></div>
      </div>
    </div>
    <div class="game-bottombar">
      <button class="btn-secondary" id="btnPrev" onclick="prevQuestion()" style="display:none">← 上一题</button>
      <button class="btn-confirm" id="btnConfirm" disabled onclick="confirmAnswer()">确认答案</button>
    </div>
  </div>

</div>

<!-- Result Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="big-emoji" id="modalEmoji">🎉</div>
    <h2 id="modalTitle">太棒了！</h2>
    <div class="stars-big" id="modalStars">
      <span class="filled">⭐</span><span class="filled">⭐</span><span class="filled">⭐</span>
    </div>
    <div class="score-label">得分：<span class="num" id="modalScore">30</span></div>
    <div class="stat-line">答对 <span id="modalCorrect">3</span>/<span id="modalTotal">6</span> 题</div>
    <div class="modal-buttons">
      <button class="btn-retry" onclick="retryLevel()">🔄 再试一次</button>
      <button class="btn-pick" onclick="backToLevels()">📋 选关</button>
      <button class="btn-next" id="modalBtnNext" onclick="goNextLevel()">➡️ 下一关</button>
    </div>
  </div>
</div>

<!-- Confirm Quit Modal -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal-box confirm-box">
    <div class="big-emoji">🤔</div>
    <h2 id="confirmTitle">确定要退出吗？</h2>
    <div class="confirm-msg">已答题成绩会自动保存哦 🏆</div>
    <div class="modal-buttons">
      <button class="btn-pick" onclick="closeConfirmQuit()">继续答题</button>
      <button class="btn-retry" onclick="doQuit()">确认退出</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const LABELS = ['A', 'B', 'C', 'D'];
const SUBJECTS_BY_GRADE = {
  2: [
    { id: 'chinese', icon: '📜', name: '语文' },
    { id: 'math', icon: '🧮', name: '数学' },
  ],
  5: [
    { id: 'chinese', icon: '📜', name: '语文' },
    { id: 'math', icon: '🧮', name: '数学' },
    { id: 'english', icon: '🔤', name: '英语' },
  ],
};
const SUBJECT_NAMES = { chinese:'语文', math:'数学', english:'英语' };
const SUBJECT_ICONS = { chinese:'❓', math:'❓', english:'❓' };
const QUESTIONS_PER_LEVEL = 6;

// -------- 二年级 语文 --------
function genGrade2Chinese(level) {
  const pool = [
    // L1-3: 拼音识字

// -------- 二年级 数学 --------
function genGrade2Math(level) {
  const qs = [];
  let maxNum, ops;
  if (level <= 5) { maxNum = 20; ops = ['+','-']; }
  else if (level <= 10) { maxNum = 50; ops = ['+','-']; }
  else if (level <= 15) { maxNum = 100; ops = ['+','-','×']; }
  else { maxNum = 100; ops = ['+','-','×','÷']; }

  for (let i = 0; i < QUESTIONS_PER_LEVEL; i++) {
    let op = ops[Math.floor(Math.random() * ops.length)];
    let a, b, answer, display, expl;
    if (op === '+') {
      a = rand(1, maxNum-1); b = rand(1, maxNum - a);
      answer = a + b; display = `${a} + ${b} = ?`;
      expl = `${a} + ${b} = ${answer}`;
    } else if (op === '-') {
      a = rand(2, maxNum); b = rand(1, a);
      answer = a - b; display = `${a} - ${b} = ?`;
      expl = `${a} - ${b} = ${answer}`;
    } else if (op === '×') {
      a = rand(2, 9); b = rand(2, 9);
      answer = a * b; display = `${a} × ${b} = ?`;
      expl = `${a} × ${b} = ${answer}`;
    } else {
      b = rand(2, 9); answer = rand(1, 9); a = b * answer;
      display = `${a} ÷ ${b} = ?`;
      expl = `${a} ÷ ${b} = ${answer}（即 ${b} × ${answer} = ${a}）`;
    }
    const { opts, ansIdx } = generateOptions(answer);
    qs.push({ q: display, o: opts, a: ansIdx, e: expl });
  }
  return qs;
}

// -------- 五年级 数学（混合：应用题 + 计算题）--------
function genGrade5Math(level) {
  const qs = [];
  for (let i = 0; i < QUESTIONS_PER_LEVEL; i++) {
    let q, opts, answer, ansIdx, expl;
    const isApp = i % 2 === 0; // 奇偶交替：应用题/纯计算
    if (level <= 5) {
      // 小数的运算 + 应用题
      if (isApp) {
        // 应用题
        const p1 = parseFloat((rand(10, 99)/10).toFixed(1));
        const p2 = parseFloat((rand(10, 99 - Math.min(p1*10, 90))/10).toFixed(1));
        answer = parseFloat((p1 + p2).toFixed(1));
        q = `小明买文具花了 ${p1} 元，买书花了 ${p2} 元，一共花了多少元？`;
        expl = `${p1} + ${p2} = ${answer} 元`;
      } else {
        // 纯计算
        const op = ['+','-','×'][rand(0,2)];
        const a = parseFloat((rand(10, 99)/10).toFixed(1));
        const b = parseFloat((rand(10, 99)/10).toFixed(1));
        if (op === '+') { answer = parseFloat((a + b).toFixed(1)); q = `${a} + ${b} = ?`; expl = `${a} + ${b} = ${answer}`; }
        else if (op === '-') { const big = Math.max(a,b); const sm = Math.min(a,b); answer = parseFloat((big - sm).toFixed(1)); q = `${big} - ${sm} = ?`; expl = `${big} - ${sm} = ${answer}`; }
        else { const m = rand(2,9); const n = parseFloat((rand(10, 50)/10).toFixed(1)); answer = parseFloat((m * n).toFixed(2)); q = `${m} × ${n} = ?`; expl = `${m} × ${n} = ${answer}`; }
      }
      const gen = generateOptions(answer);
      opts = gen.opts; ansIdx = gen.ansIdx;
    } else if (level <= 10) {
      // 分数：应用题 + 纯计算交替
      if (isApp) {
        const d = rand(6, 12);
        const n1 = rand(1, d-1); const n2 = rand(1, d - n1);
        const rn = n1 + n2; const g = gcd(rn, d);
        answer = `${rn/g}/${d/g}`;
        q = `妈妈把披萨切成 ${d} 块，小明吃了 ${n1} 块，妹妹吃了 ${n2} 块，两人一共吃了几分之几？`;
        expl = `${n1}/${d} + ${n2}/${d} = ${rn}/${d}`;
        if (rn/g !== rn) expl += ` = ${answer}（约分后）`;
      } else {
        const op = ['+','-'][rand(0,1)];
        const d = rand(4, 10);
        const n1 = rand(1, d-1); const n2 = rand(1, d-1 - (op === '+' ? 0 : n1));
        if (op === '+') {
          const rn = n1 + n2; const g = gcd(rn, d);
          answer = `${rn/g}/${d/g}`;
          q = `${n1}/${d} + ${n2}/${d} = ?`;
          expl = `${n1}/${d} + ${n2}/${d} = ${rn}/${d}`;
        } else {
          const n1b = rand(2, d-1); const n2b = rand(1, n1b-1);
          const rn = n1b - n2b; const g = gcd(rn, d);
          answer = `${rn/g}/${d/g}`;
          q = `${n1b}/${d} - ${n2b}/${d} = ?`;
          expl = `${n1b}/${d} - ${n2b}/${d} = ${rn}/${d}`;
        }
        if (gcd(parseInt(answer), parseInt(answer.split('/')[1]) || d) !== d && answer !== '0/1') expl += ` = ${answer}`;
      }
      const gen = generateOptions(answer);
      opts = gen.opts; ansIdx = gen.ansIdx;
    } else if (level <= 15) {
      // 方程：应用题 + 纯方程交替
      if (isApp) {
        // 简单购物应用题（包含未知数思维）
        const prices = [2, 3, 5, 8]; const price = prices[rand(0, prices.length-1)];
        const qty = rand(2, 6);
        answer = 100 - qty * price;
        const items = ['钢笔','苹果','糖果','笔记本'];
        const item = items[rand(0, items.length-1)];
        q = `小明买了 ${qty} ${item}，每${item.includes('笔') ? '支' : '个'} ${price} 元，给了 100 元，应找回多少元？`;
        expl = `${qty} × ${price} = ${qty*price}，100 - ${qty*price} = ${answer}`;
      } else {
        // 纯方程
        const x = rand(2, 12); const coef = rand(2, 5); const c2 = rand(2, 15);
        const result = coef * x + c2;
        q = `解方程：${coef}x + ${c2} = ${result}，x = ?`;
        answer = x;
        expl = `${coef}x = ${result} - ${c2} = ${result-c2}，x = ${answer}`;
      }
      const gen = generateOptions(answer);
      opts = gen.opts; ansIdx = gen.ansIdx;
    } else {
      // 面积（本身就是应用题）
      const shapes = ['三角形','平行四边形','梯形'];
      const shape = shapes[rand(0, shapes.length-1)];
      if (shape === '三角形') {
        const base = rand(4, 12); const height = rand(3, 10);
        const area = Math.round(0.5 * base * height * 10) / 10;
        q = `三角形底边 ${base} 米，高 ${height} 米，面积 = ?`;
        answer = area;
        expl = `面积 = 底 × 高 ÷ 2 = ${base} × ${height} ÷ 2 = ${area}`;
      } else if (shape === '平行四边形') {
        const base = rand(4, 12); const height = rand(3, 10);
        const area = base * height;
        q = `平行四边形底 ${base} 米，高 ${height} 米，面积 = ?`;
        answer = area;
        expl = `面积 = 底 × 高 = ${base} × ${height} = ${area}`;
      } else {
        const b1 = rand(3, 6); const b2 = rand(b1+1, 12); const h = rand(3, 10);
        const area = Math.round((b1 + b2) * h / 2 * 10) / 10;
        q = `梯形的上底 ${b1} 米、下底 ${b2} 米、高 ${h} 米，面积 = ?`;
        answer = area;
        expl = `面积 = (上底+下底)×高÷2 = (${b1}+${b2})×${h}÷2 = ${area}`;
      }
      const gen = generateOptions(answer);
      opts = gen.opts; ansIdx = gen.ansIdx;
    }
    qs.push({ q, o: opts, a: ansIdx, e: expl });
  }
  return qs;
}

// HELPERS
// ============================================================
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) { for (let i = arr.length-1; i > 0; i--) { const j = rand(0,i); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; }
function gcd(a, b) { while(b){[a,b]=[b,a%b]} return a; }

function generateOptions(answer) {
  const ans = answer + '';
  const opts = new Set([ans]);
  let attempts = 0;
  while (opts.size < 4 && attempts < 50) {
    let fake;
    if (typeof answer === 'number') {
      const range = Math.max(10, Math.abs(answer) * 0.4);
      const delta = rand(-Math.floor(range), Math.floor(range));
      fake = answer + (delta === 0 ? 1 : delta);
      if (fake < 0) fake = answer + 2;
      fake = fake + '';
    } else {
      fake = ans;
    }
    opts.add(fake);
    attempts++;
  }
  // 如果还没凑够，补默认值
  let counter = 0;
  while (opts.size < 4) { opts.add(`错误${counter++}`); }
  const arr = shuffle([...opts]);
  const ansIdx = arr.indexOf(ans);
  return { opts: arr, ansIdx };
}

function getBatch(pool, level, count) {
  // 对每个关卡，使用不同的偏移起始位置
  const start = ((level-1) * count) % Math.max(1, pool.length - count + 1);
  const idx = Math.min(start, Math.max(0, pool.length - count));
  return pool.slice(idx, idx + count).map(q => {
    const indices = [0, 1, 2, 3];
    shuffle(indices);
    const opts = indices.map(i => q.o[i]);
    const ansIdx = indices.indexOf(q.a);
    const explanation = q.e || `正确答案：${q.o[q.a]}`;
    return { q: q.q, o: opts, a: ansIdx, e: explanation };
  });
}

const SAVE_KEY = 'eduGameProgress';
let state = {
  grade: 2,
  subject: 'chinese',
  currentLevel: 1,
  progress: {},
};

function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) state.progress = JSON.parse(raw);
  } catch(e) {}
  if (!state.progress) state.progress = {};
}
function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state.progress)); } catch(e) {}
}
function getKey() { return `${state.grade}-${state.subject}`; }
function getLevelData() {
  return state.progress[getKey()] || { completed: [], stars: {} };
}
function levelCompleted(lvl) { return getLevelData().completed.includes(lvl); }
function levelStars(lvl) { return getLevelData().stars[lvl] || 0; }
function totalStars(grade, subject) {
  const data = state.progress[`${grade}-${subject}`];
  if (!data) return 0;
  return Object.values(data.stars).reduce((a,b)=>a+b, 0);
}
function isLevelUnlocked(lvl) { if (lvl === 1) return true; return levelCompleted(lvl - 1); }
function firstUnlocked() { for (let i = 1; i <= 20; i++) if (!levelCompleted(i)) return i; return 20; }

// SCREENS
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectGrade(g) {
  state.grade = g;
  document.getElementById('subjHeader').textContent = g + '年级';
  const subjects = SUBJECTS_BY_GRADE[g] || [];
  const grid = document.getElementById('subjectGrid');
  grid.innerHTML = '';
  if (subjects.length === 0) {
    grid.innerHTML = '<div style="color:#888;padding:30px;text-align:center">该年级暂未开放</div>';
    showScreen('screenSubject');
    return;
  }
  subjects.forEach(sub => {
    const card = document.createElement('div');
    card.className = 'subj-card';
    card.dataset.subj = sub.id;
    card.onclick = () => selectSubject(sub.id);
    card.innerHTML = `
      <span class="sicon">${sub.icon}</span>
      <div class="sinfo">
        <h2>${sub.name}</h2>
        <p>20 关 · 难度递进</p>
        <div class="sstars" id="${sub.id}Stars">⭐ 0</div>
      </div>
      <span class="sarrow">›</span>
    `;
    grid.appendChild(card);
  });
  updateSubjectProgress();
  showScreen('screenSubject');
}

function updateSubjectProgress() {
  const subjects = SUBJECTS_BY_GRADE[state.grade] || [];
  subjects.forEach(sub => {
    const data = state.progress[`${state.grade}-${sub.id}`];
    const stars = data ? Object.values(data.stars).reduce((a,b)=>a+b, 0) : 0;
    const el = document.getElementById(sub.id + 'Stars');
    if (el) el.textContent = '⭐ ' + stars;
  });
  let totalDone = 0, totalStars = 0;
  subjects.forEach(sub => {
    const data = state.progress[`${state.grade}-${sub.id}`];
    if (data) {
      totalDone += data.completed.length;
      totalStars += Object.values(data.stars).reduce((a,b)=>a+b, 0);
    }
  });
  const totalLevels = subjects.length * 20;
  const totalEl = document.getElementById('totalProgressDisplay');
  if (totalEl) {
    totalEl.textContent = `📊 ${state.grade}年级 | 已通关 ${totalDone}/${totalLevels} 关 | ⭐ ${totalStars}`;
  }
}

function selectSubject(subj) {
  state.subject = subj;
  document.getElementById('levelHeader').textContent = `${SUBJECT_NAMES[subj]} · ${state.grade}年级`;
  renderLevels();
  showScreen('screenLevels');
}

function renderLevels() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 20; i++) {
    const btn = document.createElement('div');
    const completed = levelCompleted(i);
    const stars = levelStars(i);
    const unlocked = isLevelUnlocked(i);

    btn.className = 'level-btn';
    if (!unlocked) btn.classList.add('locked');
    if (i === firstUnlocked() && unlocked && !completed) btn.classList.add('current');

    let inner = '';
    if (!unlocked) {
      inner = `<span class="lock-icon">🔒</span><span class="lvl-num" style="opacity:.4">${i}</span>`;
    } else if (completed) {
      const starStr = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
      inner = `<span class="lvl-num">${i}</span><span class="stars">${starStr}</span>`;
    } else if (i === firstUnlocked()) {
      inner = `<span class="lvl-num">${i}</span><span class="stars" style="color:#fff;font-size:11px">START</span>`;
    } else {
      inner = `<span class="lvl-num">${i}</span><span class="stars" style="color:#B89578">—</span>`;
    }
    btn.innerHTML = inner;
    if (unlocked) btn.onclick = () => startLevel(i);
    grid.appendChild(btn);
  }
  const done = getLevelData().completed.length;
  document.getElementById('levelInfo').textContent =
    `已通关 ${done}/20 关 · ⭐ ${totalStars(state.grade, state.subject)} · 第 1 关最简单`;
}

// ============================================================
// GAME
// ============================================================
let gameState = {
  level: 1,
  questions: [],
  qIndex: 0,
  lives: 3,
  score: 0,
  correctCount: 0,
  combo: 0,
  maxCombo: 0,
  answered: false,
  selected: -1,
  finished: false,
  answers: [],
};

function startLevel(lvl) {
  state.currentLevel = lvl;
  gameState.level = lvl;
  gameState.qIndex = 0;
  gameState.lives = 3;
  gameState.score = 0;
  gameState.correctCount = 0;
  gameState.combo = 0;
  gameState.maxCombo = 0;
  gameState.answered = false;
  gameState.selected = -1;
  gameState.finished = false;
  gameState.answers = [];

  gameState.questions = generateQuestions(state.grade, state.subject, lvl);

  document.getElementById('subjectIcon').textContent = SUBJECT_ICONS[state.subject];

  showScreen('screenGame');
  renderQuestion();
}

function generateQuestions(grade, subject, level) {
  if (grade === 2) {
    if (subject === 'chinese') return genGrade2Chinese(level);
    if (subject === 'math') return genGrade2Math(level);
  } else {
    if (subject === 'chinese') return genGrade5Chinese(level);
    if (subject === 'math') return genGrade5Math(level);
    if (subject === 'english') return genGrade5English(level);
  }
  return [];
}

function renderQuestion() {
  const g = gameState;
  if (g.qIndex >= g.questions.length || (g.lives <= 0 && g.answered)) {
    finishLevel();
    return;
  }
  const q = g.questions[g.qIndex];
  const saved = g.answers[g.qIndex];
  const isReview = !!saved;

  g.answered = isReview;
  g.selected = isReview ? saved.selected : -1;

  document.getElementById('qProgress').textContent = `${g.qIndex + 1} / ${g.questions.length}`;
  document.getElementById('qText').textContent = q.q;
  const answeredCount = g.answers.filter(a => a !== undefined).length;
  document.getElementById('progressFill').style.width = `${(answeredCount / g.questions.length) * 100}%`;

  const comboEl = document.getElementById('comboDisplay');
  if (g.combo > 0) {
    comboEl.textContent = `🔥 连击 ${g.combo}`;
    comboEl.classList.remove('zero');
  } else {
    comboEl.textContent = `🔥 连击 0`;
    comboEl.classList.add('zero');
  }

  document.getElementById('btnPrev').style.display = g.qIndex > 0 ? 'block' : 'none';

  const cont = document.getElementById('optionsContainer');
  cont.innerHTML = '';
  q.o.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="star-badge">⭐</span>${opt}`;
    if (isReview) {
      btn.classList.add('disabled');
      if (i === q.a) btn.classList.add('correct');
      if (i === saved.selected && i !== q.a) btn.classList.add('wrong');
    } else {
      btn.onclick = () => selectOption(i);
    }
    cont.appendChild(btn);
  });

  // Reveal box (inline answer + explanation)
  const revealBox = document.getElementById('revealBox');
  if (isReview) {
    revealBox.style.display = 'block';
    const correctText = q.o[q.a];
    if (saved.isCorrect) {
      revealBox.className = 'inline-reveal correct';
      const pts = saved.points || 10;
      document.getElementById('revealText').innerHTML = `答对啦！+${pts}分 🎉`;
    } else {
      revealBox.className = 'inline-reveal wrong';
      document.getElementById('revealText').innerHTML = `答案是：<span class="correct-ans">${correctText}</span>`;
    }
    document.getElementById('revealExplanation').innerHTML = q.e ? `<span class="exp-tag">💡 解析</span>${q.e}` : '';
  } else {
    revealBox.style.display = 'none';
  }

  // Confirm button
  const confirmBtn = document.getElementById('btnConfirm');
  if (isReview) {
    if (g.qIndex < g.questions.length - 1) {
      confirmBtn.textContent = '下一题 ➜';
      confirmBtn.onclick = nextQuestion;
    } else {
      confirmBtn.textContent = '✅ 完成闯关';
      confirmBtn.onclick = finishLevel;
    }
    confirmBtn.disabled = false;
  } else {
    confirmBtn.textContent = '确认答案';
    confirmBtn.disabled = true;
    confirmBtn.onclick = confirmAnswer;
  }

  // Animate
  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'bounceIn .35s ease';
}

function selectOption(idx) {
  if (gameState.answered) return;
  gameState.selected = idx;
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  document.getElementById('btnConfirm').disabled = false;
}

function confirmAnswer() {
  if (gameState.answered || gameState.selected < 0) return;
  const g = gameState;
  const q = g.questions[g.qIndex];
  const correct = q.a;
  const isCorrect = g.selected === correct;

  let points = 0;
  if (isCorrect) {
    g.combo++;
    if (g.combo > g.maxCombo) g.maxCombo = g.combo;
    // 连击加成：基础10分 + 连击奖励（每连击+2分，最高+10）
    const bonus = Math.min(10, (g.combo - 1) * 2);
    points = 10 + bonus;
    g.score += points;
    g.correctCount++;
  } else {
    g.combo = 0;
    g.lives--;
  }
  g.answers[g.qIndex] = { selected: g.selected, isCorrect, points };
  g.answered = true;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === correct) btn.classList.add('correct');
    if (i === g.selected && i !== correct) {
      btn.classList.add('wrong');
      document.getElementById('questionCard').classList.add('shake');
      document.getElementById('questionCard').offsetHeight;
      setTimeout(() => document.getElementById('questionCard').classList.remove('shake'), 400);
    }
  });
  updateStats();

  // Show reveal box
  const revealBox = document.getElementById('revealBox');
  revealBox.style.display = 'block';
  revealBox.style.animation = 'none';
  revealBox.offsetHeight;
  revealBox.style.animation = 'fadeIn .35s ease';
  const correctText = q.o[q.a];
  if (isCorrect) {
    revealBox.className = 'inline-reveal correct';
    document.getElementById('revealText').innerHTML = `答对啦！+${points}分 🎉`;
  } else {
    revealBox.className = 'inline-reveal wrong';
    document.getElementById('revealText').innerHTML = `答案是：<span class="correct-ans">${correctText}</span>`;
  }
  document.getElementById('revealExplanation').innerHTML = q.e ? `<span class="exp-tag">💡 解析</span>${q.e}` : '';

  // 命用完 → 延迟后弹出结果
  if (g.lives <= 0) {
    setTimeout(finishLevel, 1500);
    return;
  }

  // 改成"下一题"
  const confirmBtn = document.getElementById('btnConfirm');
  if (g.qIndex < g.questions.length - 1) {
    confirmBtn.textContent = '下一题 ➜';
    confirmBtn.onclick = nextQuestion;
  } else {
    confirmBtn.textContent = '✅ 完成闯关';
    confirmBtn.onclick = finishLevel;
  }
  confirmBtn.disabled = false;

  document.getElementById('btnPrev').style.display = g.qIndex > 0 ? 'block' : 'none';
}

function updateStats() {
  const g = gameState;
  const answeredCount = g.answers.filter(a => a !== undefined).length;
  document.getElementById('progressFill').style.width = `${(answeredCount / g.questions.length) * 100}%`;
  const comboEl = document.getElementById('comboDisplay');
  if (g.combo > 0) {
    comboEl.textContent = `🔥 连击 ${g.combo}`;
    comboEl.classList.remove('zero');
  } else {
    comboEl.textContent = `🔥 连击 0`;
    comboEl.classList.add('zero');
  }
}

function nextQuestion() {
  gameState.qIndex++;
  renderQuestion();
}

function prevQuestion() {
  if (gameState.qIndex <= 0) return;
  gameState.qIndex--;
  renderQuestion();
}

function finishLevel() {
  const g = gameState;
  if (g.finished) return;
  g.finished = true;
  const total = g.questions.length;
  const passed = g.correctCount >= Math.ceil(total * 0.6); // 60% to pass
  const ratio = g.correctCount / total;
  let stars = 0;
  if (ratio >= 0.9) stars = 3;
  else if (ratio >= 0.7) stars = 2;
  else if (ratio >= 0.6) stars = 1;

  if (passed) {
    const key = getKey();
    if (!state.progress[key]) state.progress[key] = { completed: [], stars: {} };
    const data = state.progress[key];
    if (!data.completed.includes(g.level)) data.completed.push(g.level);
    if (!data.stars[g.level] || stars > data.stars[g.level]) data.stars[g.level] = stars;
    saveProgress();
  }

  // Modal
  const modal = document.getElementById('modalOverlay');
  const emojis = passed
    ? ['', '', '🎉', '🏆']
    : ['😢', '😢', '😢', '😢'];
  document.getElementById('modalEmoji').textContent = passed ? (stars === 3 ? '🏆' : stars === 2 ? '🥳' : '🎉') : '😅';

  if (passed) {
    document.getElementById('modalTitle').textContent = stars === 3 ? '太棒了！完美通关！' : stars === 2 ? '表现不错！' : '过关啦！';
  } else {
    document.getElementById('modalTitle').textContent = '别灰心，再试一次吧！';
  }

  let starsHtml = '';
  for (let i = 0; i < 3; i++) {
    starsHtml += i < stars ? '<span class="filled">⭐</span>' : '☆';
  }
  document.getElementById('modalStars').innerHTML = starsHtml;

  document.getElementById('modalScore').textContent = g.score;
  document.getElementById('modalCorrect').textContent = g.correctCount;
  document.getElementById('modalTotal').textContent = total;

  const nextBtn = document.getElementById('modalBtnNext');
  if (passed && g.level < 20) {
    nextBtn.style.display = 'flex';
  } else {
    nextBtn.style.display = passed ? 'flex' : 'none';
  }

  modal.classList.add('show');
  if (passed) launchConfetti(stars);
}

function launchConfetti(stars) {
  const container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);
  const colors = ['#FF8C42','#FF6347','#FFB627','#6BCB77','#4A90E2','#FF6B6B'];
  const count = stars === 3 ? 60 : 30;
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = rand(5, 95) + '%';
    c.style.background = colors[rand(0, colors.length-1)];
    c.style.width = rand(6, 12) + 'px';
    c.style.height = rand(6, 12) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDuration = (rand(15, 30) / 10) + 's';
    c.style.animationDelay = (rand(0, 20) / 10) + 's';
    container.appendChild(c);
  }
  setTimeout(() => container.remove(), 4000);
}

function retryLevel() {
  document.getElementById('modalOverlay').classList.remove('show');
  startLevel(gameState.level);
}

function goNextLevel() {
  document.getElementById('modalOverlay').classList.remove('show');
  const g = gameState;
  const passed = g.correctCount >= Math.ceil(g.questions.length * 0.6);
  if (passed && g.level < 20) {
    startLevel(g.level + 1);
  } else if (passed && g.level >= 20) {
    backToLevels();
  } else {
    retryLevel();
  }
}

function backToLevels() {
  document.getElementById('modalOverlay').classList.remove('show');
  renderLevels();
  showScreen('screenLevels');
  updateSubjectProgress();
}

function confirmQuit() {
  // 已经答过题，弹出自定义确认框（避免使用浏览器 confirm 在某些环境下失效）
  if (gameState.qIndex > 0 || gameState.correctCount > 0 || gameState.answers.some(a => a !== undefined)) {
    document.getElementById('confirmOverlay').classList.add('show');
  } else {
    doQuit();
  }
}

function closeConfirmQuit() {
  document.getElementById('confirmOverlay').classList.remove('show');
}

function doQuit() {
  document.getElementById('confirmOverlay').classList.remove('show');
  // 保存已答题记录（无论是否通关）
  const g = gameState;
  if (g && g.answers && g.answers.some(a => a !== undefined)) {
    const total = g.questions.length;
    const correctCount = g.correctCount || g.answers.filter(a => a && a.isCorrect).length;
    const passed = correctCount >= Math.ceil(total * 0.6);
    const ratio = correctCount / total;
    let stars = 0;
    if (ratio >= 0.9) stars = 3;
    else if (ratio >= 0.7) stars = 2;
    else if (ratio >= 0.6) stars = 1;

    const key = getKey();
    if (!state.progress[key]) state.progress[key] = { completed: [], stars: {} };
    const data = state.progress[key];
    // ⭐ 始终保存最佳星级
    if (stars > 0 && (!data.stars[g.level] || stars > data.stars[g.level])) {
      data.stars[g.level] = stars;
    }
    // ✅ 达到 60% 则标记为通关
    if (passed && !data.completed.includes(g.level)) {
      data.completed.push(g.level);
    }
    saveProgress();
  }
  showScreen('screenLevels');
  renderLevels();
  updateSubjectProgress();
}

// ============================================================
// INIT
// ============================================================
loadProgress();
updateSubjectProgress();

// ============================================================
// EXPOSE TO WINDOW
// ============================================================
// 确保所有 onclick 处理器能访问这些函数（兼容 iframe/sandbox 严格环境）
['selectGrade','selectSubject','startLevel','showScreen','confirmQuit','prevQuestion',
 'confirmAnswer','retryLevel','backToLevels','goNextLevel','closeConfirmQuit','doQuit']
  .forEach(fn => { window[fn] = eval(fn); });
</script>
</body>
